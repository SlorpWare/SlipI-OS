<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c0c0c0" />
    <title>Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/browserfs@1.4.3/dist/browserfs.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react"
        }
      }
    </script>
    <script type="module">
      import('./app.js').catch((error) => {
        document.getElementById('root').textContent = `Module startup failed: ${error.message}`;
      });
    </script>
  </head>
  <body>
    <div id="root"><p class="boot-status">Starting filesystem...</p></div>
  </body>
</html>
